<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create your family account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container container-narrow auth-wrap">
    <div class="card auth-card">
        <span class="badge badge-class6">2-DAY FREE TRIAL</span>
        <h1>Create your family account</h1>
        <p class="muted">Follow your child’s NZ Curriculum progress across every year and subject.</p>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <div class="form-group">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" th:field="*{fullName}"/>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}"/>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="form-group">
                <label for="email">Account email</label>
                <input type="email" id="email" th:field="*{email}"/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-group">
                <label for="parentEmail">Parent / guardian email</label>
                <input type="email" id="parentEmail" th:field="*{parentEmail}" placeholder="Where progress reports should go"/>
                <p class="muted" style="margin:6px 0 0; font-size:0.85rem;">Leave blank to use the account email. We send a subject-by-subject update after every practice sheet.</p>
                <div class="field-error" th:if="${#fields.hasErrors('parentEmail')}" th:errors="*{parentEmail}"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-block">Start free trial</button>
        </form>
        <p class="muted" style="margin-top:16px;">
            Already registered? <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
