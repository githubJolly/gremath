<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container container-narrow">
    <div class="card auth-card">
        <h1>Contact LetusLearn</h1>
        <p class="muted">Families, schools and press — write to us and we will get back to you.</p>
        <div class="alert alert-success" th:if="${sent}">Thanks — your message is with us. We will reply to the email you entered.</div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}">Please include your email.</div>
        <form th:action="@{/contact}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:value="${name}"/>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required th:value="${email}"/>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required th:text="${message}"></textarea>
            </div>
            <button type="submit" class="btn btn-block">Send message</button>
        </form>
        <p class="muted" style="margin-top:16px; margin-bottom:0;">
            Or email <a href="mailto:hello@letuslearn.it.com">hello@letuslearn.it.com</a>.
        </p>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
