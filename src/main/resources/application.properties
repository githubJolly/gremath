spring.application.name=LetusLearn

# H2 file-based database (data persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/gremathdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 web console — disable in production (see application-prod.properties)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Stripe (set these as environment variables in production; do not commit real secrets)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Email: verification + parent progress after each sheet.
# Set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD in production.
# When SMTP is unset, emails are written to the application log instead.
app.mail.from=${MAIL_FROM:noreply@letuslearn.it.com}

server.port=8080
server.error.include-stacktrace=never
