# Activate with SPRING_PROFILES_ACTIVE=prod
spring.thymeleaf.cache=true
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Public site URL used in verification and parent-progress emails
app.base-url=${APP_BASE_URL:https://letuslearn.it.com}
app.mail.from=${MAIL_FROM:noreply@letuslearn.it.com}

# Keep the file database unless you point these at Postgres / MySQL in the environment
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
